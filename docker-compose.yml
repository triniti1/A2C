
services:
  # Main API service for the CRM application
  api:
    build:
      context: ./Server/AuthService     # Path to the API project
      dockerfile: Dockerfile            # Dockerfile used to build the API image
    ports:
       - "32774:8080"   # 8080 inside the container -> 32774 on the local machine
    depends_on:
      - db                              # Ensures the database starts before the API
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=a2c_crm;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - a2cnet                          # Connects the service to the custom bridge network

  # EF CLI container used for running migrations and other EF Core commands
  ef:
    build:
      context: ./Server/AuthService     # Same context as the API to access the project files
      dockerfile: Dockerfile.ef         # Dockerfile specifically for EF CLI
    entrypoint: ["bash"]                # Starts a bash shell for interactive use
    stdin_open: true                    # Keeps STDIN open for interactive commands
    tty: true                           # Allocates a pseudo-TTY
    volumes:
      - ./Server/AuthService:/app       # Mounts the project directory into the container
    depends_on:
      - db                              # Ensures the database is available before EF commands run
    networks:
      - a2cnet
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=a2c_crm;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Docker

  # PostgreSQL database service
  db:
    image: postgres:15                  # Uses official PostgreSQL version 15 image
    restart: always                     # Automatically restarts the container if it crashes
    environment:
      POSTGRES_DB: a2c_crm              # Name of the database to create
      POSTGRES_USER: postgres           # Username for the database
      POSTGRES_PASSWORD: postgres       # Password for the database
    ports:
      - "5432:5432"                     # Maps container port 5432 to host port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data # Persists database data between container restarts
    networks:
      - a2cnet
  # React client application      
  #client:
  #  build:
  #    context: ./Client
  #    dockerfile: Dockerfile
  #  container_name: a2c-client
  #  ports:
  #    - "3000:80"  # nginx is the external port, it's the 80 port of 3000
  #  networks:
  #    - a2cnet
  #  depends_on:
  #    - api
  #  environment:
  #    - REACT_APP_API_BASE_URL=http://api:8080


# Named volume for persisting PostgreSQL data
volumes:
  pgdata:

# Custom bridge network for internal communication between services
networks:
  a2cnet:
    driver: bridge
