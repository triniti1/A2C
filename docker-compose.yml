version: '3.9'

services:
  # PostgreSQL database
  db:
    image: postgres:15
    container_name: a2c_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: a2cdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - a2c_network

  # EF CLI container for migrations
  ef:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: ef
    volumes:
      - ./Server/AuthService:/app
    working_dir: /app
    entrypoint: >
      bash -c "dotnet tool list -g | grep dotnet-ef || dotnet tool install --global dotnet-ef &&
               dotnet ef database update --project AuthService.csproj"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=a2cdb;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - a2c_network
    stdin_open: true
    tty: true

  # AuthService API
  authservice:
    build:
      context: ./Server/AuthService
      dockerfile: Dockerfile
    container_name: authservice
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=a2cdb;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "32774:8080"
    networks:
      - a2c_network

  # A2CGateway
  a2cgateway:
    build:
      context: ./Server/A2CGateway
      dockerfile: Dockerfile
    container_name: a2cgateway
    depends_on:
      - authservice
    environment:
      - AuthService__BaseUrl=http://authservice:8080
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "8080:8080"
    networks:
      - a2c_network

volumes:
  db_data:

networks:
  a2c_network:
    driver: bridge
